<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C4A38"/>
      <stop offset="55%" stop-color="#B06A4E"/>
      <stop offset="100%" stop-color="#D9925F"/>
    </linearGradient>
    <radialGradient id="sun" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFF6E6"/>
      <stop offset="100%" stop-color="#FCDDA9"/>
    </radialGradient>
    <linearGradient id="swimWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5D7C9A"/>
      <stop offset="100%" stop-color="#3E5772"/>
    </linearGradient>
    <linearGradient id="runWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A9C77"/>
      <stop offset="100%" stop-color="#5A7857"/>
    </linearGradient>
    <linearGradient id="bikeWave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8F4A62"/>
      <stop offset="100%" stop-color="#6B3247"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <circle cx="256" cy="192" r="82" fill="url(#sun)"/>

    <!-- swim band (back) -->
    <path d="M 0,300 C 85,278 170,322 256,300 C 342,278 427,322 512,300 L 512,512 L 0,512 Z" fill="url(#swimWave)"/>

    <!-- run band (mid) -->
    <path d="M 0,356 C 90,382 165,332 256,356 C 347,380 422,330 512,356 L 512,512 L 0,512 Z" fill="url(#runWave)"/>

    <!-- bike band (front) -->
    <path d="M 0,420 C 80,398 175,444 256,420 C 337,396 432,444 512,420 L 512,512 L 0,512 Z" fill="url(#bikeWave)"/>
  </g>

  <rect x="6" y="6" width="500" height="500" rx="106" ry="106" fill="none" stroke="#3A1E15" stroke-opacity="0.18" stroke-width="4"/>
</svg>
