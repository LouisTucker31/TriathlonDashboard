<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Triathlon Training Dashboard</title>

  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" href="assets/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#7a3b2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Triathlon" />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/calendar.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-title">
      <h1>Triathlon Dashboard</h1>
    </div>
    <div class="app-header-actions">
      <button id="add-workout-btn" class="btn btn-primary">+ Add Workout</button>

      <label class="btn btn-secondary file-btn">
        Import CSV
        <input type="file" id="csv-import-input" accept=".csv" hidden />
      </label>

      <button id="export-backup-btn" class="btn btn-ghost">Export Backup</button>

      <label class="btn btn-ghost file-btn">
        Restore Backup
        <input type="file" id="import-backup-input" accept=".json" hidden />
      </label>

      <button id="clear-data-btn" class="btn btn-danger">Clear Data</button>
    </div>
  </header>

  <main class="dashboard-grid">
    <section class="card today-card">
      <div class="card-header">
        <h2>Today's Workout</h2>
        <span id="today-date" class="card-subtitle"></span>
      </div>
      <div id="today-card-body" class="card-body"></div>
    </section>

    <section class="card volume-card">
      <div class="card-header">
        <div>
          <h2>Weekly Volume</h2>
          <span id="volume-week-label" class="card-subtitle"></span>
        </div>
        <div class="volume-totals">
          <span id="volume-planned-total">-</span> planned ·
          <span id="volume-actual-total">-</span> actual
        </div>
      </div>
      <div id="volume-bars" class="card-body"></div>
    </section>

    <section class="card calendar-card">
      <div class="card-header calendar-header">
        <h2>Calendar</h2>
        <div class="cal-controls">
          <div class="cal-nav">
            <button id="cal-prev" class="btn btn-ghost small" aria-label="Previous">‹</button>
            <button id="cal-today" class="btn btn-ghost small">Today</button>
            <button id="cal-next" class="btn btn-ghost small" aria-label="Next">›</button>
          </div>
          <span id="cal-label" class="cal-label"></span>
        </div>
      </div>
      <div class="card-body">
        <div id="cal-grid" class="cal-grid week"></div>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay">
    <div id="modal" class="modal"></div>
  </div>

  <div id="dialog-overlay" class="modal-overlay dialog-overlay">
    <div id="dialog" class="modal dialog"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/planStore.js"></script>
  <script src="js/csvImport.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/sessionModal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
