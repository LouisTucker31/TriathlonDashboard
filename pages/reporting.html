<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excyte | Reporting</title>
<link rel="stylesheet" href="../css/styles.css">
<script>
  (function () {
    try {
      if (localStorage.getItem('excyteSidebarCollapsed') === 'true') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch (e) {}
  })();
</script>
</head>
<body data-page="reporting">

<div class="app">

  <!-- ============ SIDEBAR (injected by js/menu.js) ============ -->
  <div id="sidebar-placeholder"></div>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="main-content">

    <h1 class="page-title">Reporting</h1>

    <div class="filters-row">
      <div class="filter-group">
        <label for="exerciseNameFilter">Exercise Name</label>
        <input type="text" id="exerciseNameFilter" class="text-input" placeholder="">
      </div>

      <div class="filter-group">
        <label for="orgFilter">Organisations</label>
        <div class="select-wrapper">
          <select id="orgFilter">
            <option value="all">Nothing selected</option>
          </select>
          <svg class="select-arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#16264A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </div>

    <div class="table-panel" id="tablePanel">
      <table class="exercise-table" id="reportsTable">
        <thead>
          <tr>
            <th data-sort="exercise">Exercise<svg class="sort-icon" viewBox="0 0 10 16" width="8" height="12"><path class="arrow-up" d="M5 0L9 6H1Z"/><path class="arrow-down" d="M5 16L1 10H9Z"/></svg></th>
            <th data-sort="org">Organisation<svg class="sort-icon" viewBox="0 0 10 16" width="8" height="12"><path class="arrow-up" d="M5 0L9 6H1Z"/><path class="arrow-down" d="M5 16L1 10H9Z"/></svg></th>
            <th data-sort="date">Date &amp; Time<svg class="sort-icon" viewBox="0 0 10 16" width="8" height="12"><path class="arrow-up" d="M5 0L9 6H1Z"/><path class="arrow-down" d="M5 16L1 10H9Z"/></svg></th>
            <th data-sort="total">Summary<svg class="sort-icon" viewBox="0 0 10 16" width="8" height="12"><path class="arrow-up" d="M5 0L9 6H1Z"/><path class="arrow-down" d="M5 16L1 10H9Z"/></svg></th>
          </tr>
        </thead>
        <tbody id="reportsTableBody"></tbody>
      </table>

      <p class="no-results" id="noResults">No reports match the selected filters.</p>
    </div>

    <footer class="footer">
      <div class="footer-links">
        <a href="terms-conditions.html">Terms &amp; Conditions</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="cookie-policy.html">Cookie Policy</a>
      </div>
      <div class="footer-credit">Software development by <a href="https://www.geeks.ltd/" target="_blank" rel="noopener">Geeks</a></div>
    </footer>

  </main>
</div>

<script src="../js/menu.js"></script>
<script src="../js/reporting.js"></script>
</body>
</html>
